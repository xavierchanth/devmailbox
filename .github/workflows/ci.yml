name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bunx tsc --noEmit -p web
      - run: bun test
      - run: bunx vite build web
      - run: bun scripts/compile.ts dist/devmailbox
